[package]
name = "lisan"
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gitmofficiel-dot/lisan"
homepage = "https://github.com/gitmofficiel-dot/lisan"
authors = ["GITM"]
readme = "README.md"
description = "لسان: نواة لغة برمجة عربية مكتوبة بلغة Rust"

[lib]
name = "lisan"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lisan"
path = "src/main.rs"
