<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="أيقونة تطبيق استوديو لسان لسطح المكتب - Lisan App Icon">
  <defs>
    <!-- تدرج عميق لأيقونة سطح المكتب (Linux / macOS / PWA) -->
    <linearGradient id="iconBase" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#172542"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>

    <!-- لمعة زجاجية علوية للأيقونة -->
    <linearGradient id="topSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="iconEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="iconLam" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>

    <filter id="glyphShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- جسم أيقونة التطبيق القياسي بهوامش macOS / Freedesktop / PWA -->
  <g filter="url(#appShadow)">
    <rect x="28" y="28" width="456" height="456" rx="106" fill="url(#iconBase)"/>
    <rect x="28" y="28" width="456" height="456" rx="106" fill="url(#coreGlow)"/>
    <rect x="28" y="28" width="456" height="236" rx="106" fill="url(#topSheen)"/>
    <rect x="30" y="30" width="452" height="452" rx="104" fill="none" stroke="url(#iconBorder)" stroke-width="4"/>
  </g>

  <!-- إطار الشريحة الداخلية ومسارات الدارات -->
  <rect x="68" y="68" width="376" height="376" rx="76" fill="none" stroke="#1e293b" stroke-width="2"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 106 102 L 134 130 L 166 130" stroke="#10b981" stroke-width="4" opacity="0.75"/>
    <path d="M 406 102 L 378 130 L 346 130" stroke="#f59e0b" stroke-width="4" opacity="0.75"/>
    <path d="M 106 410 L 134 382 L 166 382" stroke="#f59e0b" stroke-width="4" opacity="0.75"/>
    <path d="M 406 410 L 378 382 L 346 382" stroke="#10b981" stroke-width="4" opacity="0.75"/>
  </g>

  <g>
    <circle cx="106" cy="102" r="7.5" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <circle cx="406" cy="102" r="7.5" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="106" cy="410" r="7.5" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="406" cy="410" r="7.5" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
  </g>

  <!-- الرمز المركزي البارز { ل } -->
  <g filter="url(#glyphShadow)">
    <!-- الأقواس البرمجية { } -->
    <g fill="none" stroke="url(#iconEmerald)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 156 144 C 124 144, 114 160, 114 190 L 114 224 C 114 244, 100 256, 80 256 C 100 256, 114 268, 114 288 L 114 322 C 114 352, 124 368, 156 368"/>
      <path d="M 356 144 C 388 144, 398 160, 398 190 L 398 224 C 398 244, 412 256, 432 256 C 412 256, 398 268, 398 288 L 398 322 C 398 352, 388 368, 356 368"/>
    </g>

    <!-- حرف اللام "ل" -->
    <path d="
      M 322 120
      L 322 284
      C 322 344, 286 378, 238 378
      C 194 378, 174 348, 174 304
      L 208 288
      C 208 324, 218 342, 240 342
      C 270 342, 286 320, 286 282
      L 286 146
      Z
    " fill="url(#iconLam)"/>

    <!-- مسار الدارة داخل اللام -->
    <path d="M 304 162 L 304 270" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="304" cy="277" r="5" fill="#f59e0b"/>

    <!-- النقطة المعينية الذهبية -->
    <polygon points="236,196 265,225 236,254 207,225" fill="url(#iconGold)"/>
    <circle cx="236" cy="225" r="5" fill="#0f172a"/>
  </g>
</svg>
