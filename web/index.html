<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة لسان الشاملة | أردوينو • هواتف • أيقونات • تصميمات • ويب</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
            --editor-bg: #0b1120;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text);
        }

        .logo span {
            color: var(--primary);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 0.65rem;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            background-color: var(--editor-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        button.run-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0.55rem 1.2rem;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        button.run-btn:hover {
            background-color: #059669;
        }

        button.ino-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.55rem 1.1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        button.ino-btn:hover {
            background-color: #0369a1;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 1.25rem;
            gap: 1.25rem;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
        }

        .editor-pane, .output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .pane-header {
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea#codeEditor {
            flex: 1;
            background-color: var(--editor-bg);
            color: #e2e8f0;
            border: none;
            padding: 1rem 1.25rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.02rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            direction: rtl;
            tab-size: 4;
            min-height: 440px;
        }

        pre#outputConsole {
            flex: 1;
            background-color: var(--editor-bg);
            color: #38bdf8;
            padding: 1rem 1.25rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.98rem;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            direction: rtl;
            min-height: 440px;
        }

        iframe#visualPreview {
            flex: 1;
            border: none;
            background-color: #0f172a;
            min-height: 480px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 0.9rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            background-color: var(--panel-bg);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>لسان</span> 1.0.0
            <span class="tagline">أردوينو ومتحكمات • تطبيقات هواتف • أيقونات وتصميمات • ويب</span>
        </div>
        <div class="actions">
            <select id="exampleSelector">
                <option value="mobile">📱 تطبيق هاتف ذكي وأيقونات (موبايل)</option>
                <option value="arduino">🤖 برمجة أردوينو ومتحكمات (المنزل الذكي)</option>
                <option value="web_ui">🌐 بناء موقع ويب وتصميمات عصرية</option>
                <option value="welcome">👋 مرحباً بلغة لسان (بدون فواصل)</option>
                <option value="oop">🏛️ الكائنات والوراثة والدوال العليا</option>
                <option value="json">📦 تحليل وترميز JSON</option>
                <option value="exceptions">🛡️ معالجة الاستثناءات (حاول/التقط)</option>
                <option value="diagnostics">🔍 مصحح الأخطاء الذكي</option>
            </select>
            <button class="run-btn" id="runButton">
                <span>▶ تشغيل ومعاينة (Ctrl+Enter)</span>
            </button>
            <button class="ino-btn" id="arduinoBtn">
                <span>⚡ توليد كود أردوينو (.ino)</span>
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-header">
                <span>محرر الكود العربي</span>
                <span class="status-badge" id="wasmStatus">جاري تحميل WebAssembly...</span>
            </div>
            <textarea id="codeEditor" spellcheck="false" placeholder="اكتب أوامرك البرمجية هنا بالعربية..."></textarea>
        </div>

        <div class="output-pane">
            <div class="pane-header">
                <span id="outputTitle">شاشة المخرجات والمعاينة الحية</span>
                <div style="display:flex;gap:10px;">
                    <button id="toggleViewBtn" style="background:none; border:none; color:#38bdf8; cursor:pointer; font-size:0.82rem; display:none;">التبديل بين الكود والمعاينة</button>
                    <button id="clearBtn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.8rem;">مسح الشاشة</button>
                </div>
            </div>
            <pre id="outputConsole">مرحباً بك في لسان! اضغط "تشغيل ومعاينة" لتنفيذ الكود.</pre>
            <iframe id="visualPreview"></iframe>
        </div>
    </div>

    <footer>
        لسان — لغة برمجة عربية شاملة للمتحكمات الدقيقة والهواتف الذكية والويب وسطح المكتب
    </footer>

    <script src="lisan.js"></script>
    <script>
        const examples = {
            mobile: `// تصميم تطبيق هاتف ذكي تفاعلي بالأيقونات والتصميمات
استورد "هاتف"

دع تطبيقي = جديد تطبيق_هاتف("بيتي الذكي"، "زمردي")

تطبيقي.أضف_إحصائية("درجة الحرارة"، "24°C"، "حرارة")
تطبيقي.أضف_بطاقة("لوحة الأردوينو متصلة"، "ESP32 متصلة عبر الواي فاي بنجاح"، "أردوينو")
تطبيقي.أضف_مفتاح_تحكم("إضاءة غرفة المعيشة"، "شمس"، صحيح)
تطبيقي.أضف_مفتاح_تحكم("قفل الباب الذكي"، "قفل"، صحيح)
تطبيقي.أضف_مفتاح_تحكم("تكييف الهواء"، "واي_فاي"، خطأ)
تطبيقي.أضف_زر("تشغيل وضع الأمان الشامل"، "درع"، "تم تفعيل الحماية الذكية!")

اطبع(تطبيقي.بناء_واجهة())
`,
            arduino: `// برمجة أردوينو ومتحكمات دقيقة (تعمل كمحاكي وتُترجم إلى C++ .ino)
استورد "اردوينو"

دع منفذ_مصباح = 13
دع منفذ_مروحة = 9

دالة إعداد() {
    تسلسلي_ابدأ(9600)
    وضع_المنفذ(منفذ_مصباح، "مخرج")
    وضع_المنفذ(منفذ_مروحة، "مخرج")
    تسلسلي_اطبع("بدأ تشغيل نظام المنزل الذكي بلغة لسان")
}

دالة تكرار() {
    دع قراءة_حساس = اقرأ_تماثلي(0)
    إذا (قراءة_حساس > 500) {
        اكتب_رقمي(منفذ_مصباح، 1)
        اكتب_تماثلي(منفذ_مروحة، 200)
    } وإلا {
        اكتب_رقمي(منفذ_مصباح، 0)
        اكتب_تماثلي(منفذ_مروحة، 0)
    }
    انتظر_ملي(500)
}

// اختبار المحاكاة المباشرة للمكتبات:
دع سيرفو = جديد محرك_سيرفو(10)
اطبع("زاوية السيرفو بعد التحريك: " + نص(سيرفو.حرك(135)))

دع حساس = جديد حساس_مسافة(5، 6)
اطبع("المسافة المقاسة بالسنتيمتر: " + نص(حساس.اقرأ_سم()))
`,
            web_ui: `// بناء موقع ويب متجاوب بالكامل مع الأيقونات والنسق الملكي
استورد "ويب"

دع موقعي = جديد موقع_ويب("منصة لسان السحابية"، "ملكي")

موقعي.قسم_رئيسي(
    "برمج كل شيء بلغتك العربية"،
    "من شرائح الأردوينو والمتحكمات الدقيقة إلى تطبيقات الهواتف الذكية ومواقع الويب الحديثة"،
    "ابدأ مشروعك الآن"،
    "روبوت"
)

موقعي.أضف_بطاقة("برمجة المتحكمات والأردوينو"، "تحويل فوري إلى C++ مع مكتبات السيرفو والحساسات والواي فاي"، "أردوينو")
موقعي.أضف_بطاقة("تطبيقات الهواتف الذكية"، "واجهات جوال عصرية مع دعم التثبيت المباشر PWA وأيقونات متجهة"، "هاتف")
موقعي.أضف_بطاقة("سرعة وأمان Rust"، "تعمل محلياً وعلى الويب عبر WebAssembly بصفر اعتماديات خارجية"، "درع")

اطبع(موقعي.بناء_html())
`,
            welcome: `// مرحباً بك في لغة لسان!
دالة ترحيب(اسم) {
    أرجع "أهلاً بك يا " + اسم + " في لغة لسان العربية!"
}

دع طلاب = ["سارة"، "أحمد"، "يوسف"]
لكل (طالب في طلاب) {
    اطبع(ترحيب(طالب))
}
`,
            oop: `// الوراثة والدوال المجهولة والدوال العليا في لسان 1.0
صنف مركبة {
    دالة بناء(النوع) {
        هذا.النوع = النوع
    }
    دالة وصف() {
        أرجع "مركبة: " + هذا.النوع
    }
}

صنف سيارة_كهربائية يرث مركبة {
    دالة بناء(النوع، المدى) {
        أصل.بناء(النوع)
        هذا.المدى = المدى
    }
}

دع س = جديد سيارة_كهربائية("لوسيد"، 800)
اطبع(س.وصف() + " بمدى " + نص(س.المدى) + " كم")

دع أرقام = [1، 2، 3، 4، 5]
اطبع("المربعات: " + نص(أرقام.طبق(دالة(ن) => ن * ن)))
`,
            json: `// التعامل الكامل مع JSON في لسان
دع بيانات = {
    "الاسم": "نواة لسان"،
    "الإصدار": 1.0،
    "المميزات": ["أردوينو"، "هواتف"، "ويب"، "أيقونات"]
}
دع نص_json = ترميز_json(بيانات)
اطبع("JSON: " + نص_json)
`,
            exceptions: `// معالجة الأخطاء والاستثناءات بأمان
حاول {
    ارمِ "تنبيه تجريبي من النظام"
} التقط (خ) {
    اطبع("تم الإمساك بالاستثناء: " + خ)
} أخيرًا {
    اطبع("اكتمل التنفيذ بأمان.")
}
`,
            diagnostics: `// تجربة مصحح الأخطاء الذكي
دع النتيجة = 100
اطببع("مرحبا")
`
        };

        let runtime = null;
        const editor = document.getElementById('codeEditor');
        const consoleEl = document.getElementById('outputConsole');
        const previewEl = document.getElementById('visualPreview');
        const toggleViewBtn = document.getElementById('toggleViewBtn');
        const statusEl = document.getElementById('wasmStatus');
        const runBtn = document.getElementById('runButton');
        const arduinoBtn = document.getElementById('arduinoBtn');
        const selector = document.getElementById('exampleSelector');
        const clearBtn = document.getElementById('clearBtn');

        editor.value = examples.mobile;

        async function initWasm() {
            try {
                runtime = new LisanRuntime();
                await runtime.init('./lisan.wasm');
                statusEl.textContent = 'محرك WebAssembly جاهز (v1.0)';
                statusEl.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
                runCode();
            } catch (err) {
                statusEl.textContent = 'تعذر تحميل WebAssembly: ' + err.message;
                statusEl.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
                statusEl.style.color = '#f87171';
            }
        }

        function showVisualPreview(htmlContent) {
            previewEl.style.display = 'block';
            consoleEl.style.display = 'none';
            toggleViewBtn.style.display = 'inline';
            previewEl.srcdoc = htmlContent;
        }

        function showConsoleOutput(text, isError = false) {
            previewEl.style.display = 'none';
            consoleEl.style.display = 'block';
            consoleEl.style.direction = text.includes('#include <Arduino.h>') ? 'ltr' : 'rtl';
            consoleEl.textContent = text || '(تم التنفيذ بنجاح بلا مخرجات)';
            consoleEl.style.color = isError ? '#ef4444' : '#38bdf8';
        }

        function runCode() {
            if (!runtime) return;
            const source = editor.value;
            try {
                const output = runtime.eval(source);
                if (output.includes('<!DOCTYPE html>') || output.includes('<svg ')) {
                    consoleEl.textContent = output;
                    showVisualPreview(output);
                } else {
                    toggleViewBtn.style.display = 'none';
                    showConsoleOutput(output, output.startsWith('خطأ:'));
                }
            } catch (err) {
                showConsoleOutput('خطأ تشغيل: ' + err.message, true);
            }
        }

        arduinoBtn.addEventListener('click', () => {
            if (!runtime) return;
            try {
                const ino = runtime.arduino(editor.value);
                toggleViewBtn.style.display = 'none';
                showConsoleOutput(ino, ino.startsWith('خطأ:'));
            } catch (err) {
                showConsoleOutput('خطأ ترجمة أردوينو: ' + err.message, true);
            }
        });

        toggleViewBtn.addEventListener('click', () => {
            if (previewEl.style.display === 'none') {
                previewEl.style.display = 'block';
                consoleEl.style.display = 'none';
            } else {
                previewEl.style.display = 'none';
                consoleEl.style.display = 'block';
            }
        });

        runBtn.addEventListener('click', runCode);

        selector.addEventListener('change', () => {
            const key = selector.value;
            if (examples[key]) {
                editor.value = examples[key];
                runCode();
            }
        });

        clearBtn.addEventListener('click', () => {
            showConsoleOutput('');
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        initWasm();
    </script>
</body>
</html>
